<div class="kairos-flex kairos-col kairos-gap-loose">
  <div class="kairos-flex kairos-col kairos-gap-extra-tight">
    <h1 class="kairos-text-3xl kairos-font-bold">Checkbox (تحديد)</h1>
    <p class="kairos-text-color-secondary">مربع اختيار متعدد — مع كايوس إنبت (kairos-input).</p>
  </div>

  <div class="kairos-bg-surface kairos-border kairos-border-color-muted kairos-p-loose kairos-flex kairos-col kairos-gap-standard">
    <h3 class="kairos-text-sm kairos-text-color-muted kairos-tracking-widest kairos-uppercase">States (الحالات)</h3>
    <div class="kairos-flex kairos-items-center kairos-gap-loose kairos-wrap">
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="checkbox" class="kairos-chk kairos-input" />
        <span class="kairos-text-sm kairos-text-color-muted">Unchecked</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="checkbox" class="kairos-chk kairos-input" checked />
        <span class="kairos-text-sm kairos-text-color-muted">Checked</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact">
        <input type="checkbox" class="kairos-chk kairos-input" disabled />
        <span class="kairos-text-sm kairos-text-color-placeholder">Disabled</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact">
        <input type="checkbox" class="kairos-chk kairos-input" checked disabled />
        <span class="kairos-text-sm kairos-text-color-placeholder">Checked + Disabled</span>
      </label>
    </div>
  </div>

  <div class="kairos-bg-surface kairos-border kairos-border-color-muted kairos-p-loose kairos-flex kairos-col kairos-gap-standard">
    <h3 class="kairos-text-sm kairos-text-color-muted kairos-tracking-widest kairos-uppercase">Intents (الألوان الدلالية)</h3>
    <div class="kairos-flex kairos-items-center kairos-gap-loose kairos-wrap">
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="checkbox" class="kairos-chk kairos-input kairos-intent-pvw" checked />
        <span class="kairos-text-sm kairos-text-color-pvw">PVW</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="checkbox" class="kairos-chk kairos-input kairos-intent-pgm" checked />
        <span class="kairos-text-sm kairos-text-color-pgm">PGM</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="checkbox" class="kairos-chk kairos-input kairos-intent-warning" checked />
        <span class="kairos-text-sm kairos-text-color-warning">Warning</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="checkbox" class="kairos-chk kairos-input kairos-intent-info" checked />
        <span class="kairos-text-sm kairos-text-color-info">Info</span>
      </label>
    </div>
  </div>

  <div class="kairos-bg-surface kairos-border kairos-border-color-muted kairos-p-loose kairos-flex kairos-col kairos-gap-standard">
    <h3 class="kairos-text-sm kairos-text-color-muted kairos-tracking-widest kairos-uppercase">Broadcast: Audio Channel Mutes</h3>
    <div class="kairos-flex kairos-col kairos-gap-extra-tight">
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="checkbox" class="kairos-chk kairos-input kairos-intent-pgm" />
        <i class="kairos-icon-microphone kairos-icon-sm kairos-icon-muted"></i>
        <span class="kairos-text-sm kairos-font-bold">Channel 01</span>
        <span class="kairos-text-xs kairos-text-color-muted kairos-font-mono kairos-ml-auto">Muted</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="checkbox" class="kairos-chk kairos-input" />
        <i class="kairos-icon-microphone kairos-icon-sm kairos-icon-muted"></i>
        <span class="kairos-text-sm kairos-font-bold">Channel 02</span>
        <span class="kairos-text-xs kairos-text-color-muted kairos-font-mono kairos-ml-auto">Active</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="checkbox" class="kairos-chk kairos-input" />
        <i class="kairos-icon-microphone kairos-icon-sm kairos-icon-muted"></i>
        <span class="kairos-text-sm kairos-font-bold">Channel 03</span>
        <span class="kairos-text-xs kairos-text-color-muted kairos-font-mono kairos-ml-auto">Active</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact">
        <input type="checkbox" class="kairos-chk kairos-input" checked disabled />
        <i class="kairos-icon-microphone kairos-icon-sm kairos-icon-muted"></i>
        <span class="kairos-text-sm kairos-font-bold kairos-text-color-placeholder">Channel 04</span>
        <span class="kairos-text-xs kairos-text-color-placeholder kairos-font-mono kairos-ml-auto">Locked</span>
      </label>
    </div>
  </div>
</div>
