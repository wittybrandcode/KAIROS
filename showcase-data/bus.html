<div class="kairos-flex kairos-col kairos-gap-loose">
  <div class="kairos-flex kairos-col kairos-gap-extra-tight">
    <h1 class="kairos-text-3xl kairos-font-bold">Bus (الناقل)</h1>

  </div>
  <div class="kairos-bg-surface kairos-border kairos-border-color-muted kairos-p-loose kairos-flex kairos-col kairos-gap-standard">

    <div class="kairos-bus">
      <div class="kairos-bus-row">
        <span class="kairos-bus-label">PGM</span>
        <div class="kairos-bus-btns">

          <button class="kairos-bus-btn">VTR</button>
          <button class="kairos-bus-btn">BLACK</button>
        </div>
      </div>
      <div class="kairos-bus-row">
        <span class="kairos-bus-label pvw">PVW</span>
        <div class="kairos-bus-btns">
          <button class="kairos-bus-btn">CAM 01</button>
          <button class="kairos-bus-btn pvw">CAM 02</button>
          <button class="kairos-bus-btn">VTR</button>
          <button class="kairos-bus-btn">BLACK</button>
        </div>
      </div>
    </div>
  </div>
  <div class="kairos-bg-surface kairos-border kairos-border-color-muted kairos-p-loose kairos-flex kairos-col kairos-gap-standard">
    <h3 class="kairos-text-sm kairos-text-color-muted kairos-tracking-widest kairos-uppercase">Broadcast: Switcher Bus</h3>
    <div class="kairos-flex kairos-col kairos-gap-standard kairos-bg-deep kairos-p-standard kairos-border kairos-border-color-muted">
      <div class="kairos-pgm-pvw-row">
        <div class="kairos-pgm-btn active"><span class="kairos-pgm-label">PGM</span><span class="kairos-pgm-name">CAM 01</span></div>
        <div class="kairos-pvw-btn active"><span class="kairos-pvw-label">PVW</span><span class="kairos-pvw-name">CAM 02</span></div>
      </div>
      <div class="kairos-source-grid"><button class="kairos-source-grid-btn pgm">CAM 01</button><button class="kairos-source-grid-btn pvw">CAM 02</button><button class="kairos-source-grid-btn">VTR</button><button class="kairos-source-grid-btn">GFX</button></div>
      <div class="kairos-flex kairos-gap-compact"><button class="kairos-btn kairos-intent-pgm kairos-variant-solid kairos-flex-1">CUT</button><button class="kairos-btn kairos-variant-outline kairos-flex-1">AUTO</button></div>
    </div>
  </div>
