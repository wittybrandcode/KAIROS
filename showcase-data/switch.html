<div class="kairos-flex kairos-col kairos-gap-loose">
  <div class="kairos-flex kairos-col kairos-gap-extra-tight">
    <h1 class="kairos-text-3xl kairos-font-bold">Switch (المفتاح)</h1>
    <p class="kairos-text-color-secondary">مفتاح تشغيل/إيقاف — للتحكم في إشارات البث، كتم الصوت، وتفعيل المسارات.</p>
  </div>

  <div class="kairos-bg-surface kairos-border kairos-border-color-muted kairos-p-loose kairos-flex kairos-col kairos-gap-standard">
    <h3 class="kairos-text-sm kairos-text-color-muted kairos-tracking-widest kairos-uppercase">States (الحالات)</h3>
    <div class="kairos-flex kairos-items-center kairos-gap-loose kairos-wrap">
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="checkbox" class="kairos-switch kairos-input" />
        <span class="kairos-text-sm kairos-text-color-muted">Off</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="checkbox" class="kairos-switch kairos-input" checked />
        <span class="kairos-text-sm kairos-text-color-pvw">On</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact">
        <input type="checkbox" class="kairos-switch kairos-input" disabled />
        <span class="kairos-text-sm kairos-text-color-placeholder">Disabled Off</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact">
        <input type="checkbox" class="kairos-switch kairos-input" checked disabled />
        <span class="kairos-text-sm kairos-text-color-placeholder">Disabled On</span>
      </label>
    </div>
  </div>

  <div class="kairos-bg-surface kairos-border kairos-border-color-muted kairos-p-loose kairos-flex kairos-col kairos-gap-standard">
    <h3 class="kairos-text-sm kairos-text-color-muted kairos-tracking-widest kairos-uppercase">Intents (الألوان الدلالية)</h3>
    <div class="kairos-flex kairos-items-center kairos-gap-loose kairos-wrap">
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="checkbox" class="kairos-switch kairos-input kairos-intent-pvw" checked />
        <span class="kairos-text-sm kairos-text-color-pvw">PVW</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="checkbox" class="kairos-switch kairos-input kairos-intent-pgm" checked />
        <span class="kairos-text-sm kairos-text-color-pgm">PGM</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="checkbox" class="kairos-switch kairos-input kairos-intent-warning" checked />
        <span class="kairos-text-sm kairos-text-color-warning">Warning</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="checkbox" class="kairos-switch kairos-input kairos-intent-info" checked />
        <span class="kairos-text-sm kairos-text-color-info">Info</span>
      </label>
    </div>
  </div>

  <div class="kairos-bg-surface kairos-border kairos-border-color-muted kairos-p-loose kairos-flex kairos-col kairos-gap-standard">
    <h3 class="kairos-text-sm kairos-text-color-muted kairos-tracking-widest kairos-uppercase">Broadcast: Audio Channel Controls</h3>
    <div class="kairos-flex kairos-col kairos-gap-standard kairos-bg-deep kairos-p-standard kairos-border kairos-border-color-muted">
      <div class="kairos-flex kairos-items-center kairos-gap-compact kairos-border-b kairos-border-color-muted kairos-pb-compact">
        <span class="kairos-status-dot pvw"></span>
        <span class="kairos-text-sm kairos-font-bold">Audio Follows Video</span>
        <label class="kairos-flex kairos-items-center kairos-ml-auto">
          <input type="checkbox" class="kairos-switch kairos-input kairos-intent-pvw" checked />
        </label>
      </div>
      <div class="kairos-flex kairos-col kairos-gap-extra-tight">
        <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer kairos-p-compact kairos-bg-surface kairos-border kairos-border-color-muted">
          <i class="kairos-icon-microphone kairos-icon-sm kairos-text-color-muted"></i>
          <span class="kairos-text-sm kairos-font-bold">Channel 01 · Studio Mic</span>
          <span class="kairos-text-xs kairos-font-mono kairos-text-color-pvw kairos-ml-auto">ON</span>
          <input type="checkbox" class="kairos-switch kairos-input kairos-intent-pvw" checked />
        </label>
        <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer kairos-p-compact kairos-bg-surface kairos-border kairos-border-color-muted">
          <i class="kairos-icon-microphone kairos-icon-sm kairos-text-color-muted"></i>
          <span class="kairos-text-sm kairos-font-bold">Channel 02 · Guest</span>
          <span class="kairos-text-xs kairos-font-mono kairos-text-color-muted kairos-ml-auto">OFF</span>
          <input type="checkbox" class="kairos-switch kairos-input" />
        </label>
        <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-p-compact kairos-bg-surface kairos-border kairos-border-color-muted">
          <i class="kairos-icon-speaker-high kairos-icon-sm kairos-text-color-muted"></i>
          <span class="kairos-text-sm kairos-font-bold kairos-text-color-placeholder">Channel 03 · Playback</span>
          <span class="kairos-text-xs kairos-font-mono kairos-text-color-placeholder kairos-ml-auto">LOCKED</span>
          <input type="checkbox" class="kairos-switch kairos-input" disabled />
        </label>
      </div>
      <div class="kairos-flex kairos-items-center kairos-gap-compact kairos-text-xs kairos-font-mono kairos-text-color-muted">
        <span class="kairos-status-dot pvw"></span>
        <span>AFV enabled — audio will cut with video Take</span>
      </div>
    </div>
  </div>
</div>
