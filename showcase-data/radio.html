<div class="kairos-flex kairos-col kairos-gap-loose">
  <div class="kairos-flex kairos-col kairos-gap-extra-tight">
    <h1 class="kairos-text-3xl kairos-font-bold">Radio (اختيار)</h1>
    <p class="kairos-text-color-secondary">مربع اختيار — حافة 1/2/2px + padding 2/2/4px + مؤشر 4/8/12px.</p>
  </div>

  <div class="kairos-bg-surface kairos-border kairos-border-color-muted kairos-p-loose kairos-flex kairos-col kairos-gap-standard">
    <h3 class="kairos-text-sm kairos-text-color-muted kairos-tracking-widest kairos-uppercase">States (الحالات)</h3>
    <div class="kairos-flex kairos-items-center kairos-gap-loose kairos-wrap">
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="radio" name="radio-states" class="kairos-radio kairos-input" />
        <span class="kairos-text-sm kairos-text-color-muted">Unchecked</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="radio" name="radio-states" class="kairos-radio kairos-input" checked />
        <span class="kairos-text-sm kairos-text-color-muted">Checked</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact">
        <input type="radio" name="radio-states" class="kairos-radio kairos-input" disabled />
        <span class="kairos-text-sm kairos-text-color-placeholder">Disabled</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact">
        <input type="radio" name="radio-states" class="kairos-radio kairos-input" checked disabled />
        <span class="kairos-text-sm kairos-text-color-placeholder">Checked + Disabled</span>
      </label>
    </div>
  </div>

  <div class="kairos-bg-surface kairos-border kairos-border-color-muted kairos-p-loose kairos-flex kairos-col kairos-gap-standard">
    <h3 class="kairos-text-sm kairos-text-color-muted kairos-tracking-widest kairos-uppercase">Intents (الألوان الدلالية)</h3>
    <div class="kairos-flex kairos-items-center kairos-gap-loose kairos-wrap">
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="radio" name="radio-intents" class="kairos-radio kairos-input" checked />
        <span class="kairos-text-sm kairos-text-color-muted">Default</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="radio" name="radio-intents" class="kairos-radio kairos-input kairos-intent-pvw" checked />
        <span class="kairos-text-sm kairos-text-color-pvw">PVW</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="radio" name="radio-intents" class="kairos-radio kairos-input kairos-intent-pgm" checked />
        <span class="kairos-text-sm kairos-text-color-pgm">PGM</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="radio" name="radio-intents" class="kairos-radio kairos-input kairos-intent-warning" checked />
        <span class="kairos-text-sm kairos-text-color-warning">Warning</span>
      </label>
      <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
        <input type="radio" name="radio-intents" class="kairos-radio kairos-input kairos-intent-info" checked />
        <span class="kairos-text-sm kairos-text-color-info">Info</span>
      </label>
    </div>
  </div>

  <div class="kairos-bg-surface kairos-border kairos-border-color-muted kairos-p-loose kairos-flex kairos-col kairos-gap-standard">
    <h3 class="kairos-text-sm kairos-text-color-muted kairos-tracking-widest kairos-uppercase">Sizes (الأحجام)</h3>
   <div class="kairos-flex kairos-items-center kairos-gap-loose kairos-wrap">
     <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
       <input type="radio" name="radio-sizes" class="kairos-radio kairos-input kairos-size-sm" checked />
       <span class="kairos-text-sm kairos-text-color-muted">sm — 10px</span>
     </label>
     <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
       <input type="radio" name="radio-sizes" class="kairos-radio kairos-input" checked />
       <span class="kairos-text-sm kairos-text-color-muted">md — 16px</span>
     </label>
     <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
       <input type="radio" name="radio-sizes" class="kairos-radio kairos-input kairos-size-lg" checked />
       <span class="kairos-text-sm kairos-text-color-muted">lg — 24px</span>
     </label>
   </div>
 </div>

 <div class="kairos-bg-surface kairos-border kairos-border-color-muted kairos-p-loose kairos-flex kairos-col kairos-gap-standard">
   <h3 class="kairos-text-sm kairos-text-color-muted kairos-tracking-widest kairos-uppercase">Source Selection (اختيار المصدر)</h3>
    <fieldset class="kairos-fieldset">
      <legend class="kairos-legend">Program Source</legend>
      <div class="kairos-flex kairos-col kairos-gap-standard kairos-mt-standard">
        <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
          <input type="radio" name="source" value="cam01" class="kairos-radio kairos-input kairos-intent-pvw" checked />
          <i class="kairos-icon-video-camera kairos-icon-sm kairos-icon-muted"></i>
          <span class="kairos-text-sm kairos-font-bold">Camera 01</span>
          <span class="kairos-text-xs kairos-text-color-muted kairos-font-mono kairos-ml-auto">SDI-1</span>
        </label>
        <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
          <input type="radio" name="source" value="cam02" class="kairos-radio kairos-input kairos-intent-pvw" />
          <i class="kairos-icon-video-camera kairos-icon-sm kairos-icon-muted"></i>
          <span class="kairos-text-sm kairos-font-bold">Camera 02</span>
          <span class="kairos-text-xs kairos-text-color-muted kairos-font-mono kairos-ml-auto">SDI-2</span>
        </label>
        <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
          <input type="radio" name="source" value="vtr03" class="kairos-radio kairos-input kairos-intent-pvw" />
          <i class="kairos-icon-film-strip kairos-icon-sm kairos-icon-muted"></i>
          <span class="kairos-text-sm kairos-font-bold">VTR 03</span>
          <span class="kairos-text-xs kairos-text-color-muted kairos-font-mono kairos-ml-auto">SDI-3</span>
        </label>
        <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
          <input type="radio" name="source" value="gfx01" class="kairos-radio kairos-input kairos-intent-pvw" disabled />
          <i class="kairos-icon-presentation kairos-icon-sm kairos-icon-muted"></i>
          <span class="kairos-text-sm kairos-font-bold kairos-text-color-placeholder">GFX 01</span>
          <span class="kairos-text-xs kairos-text-color-placeholder kairos-font-mono kairos-ml-auto">SDI-4</span>
        </label>
      </div>
    </fieldset>
  </div>

  <div class="kairos-bg-surface kairos-border kairos-border-color-muted kairos-p-loose kairos-flex kairos-col kairos-gap-standard">
    <h3 class="kairos-text-sm kairos-text-color-muted kairos-tracking-widest kairos-uppercase">Output Routing (توجيه المخرجات)</h3>
    <fieldset class="kairos-fieldset">
      <legend class="kairos-legend">Route Destination</legend>
      <div class="kairos-flex kairos-col kairos-gap-standard kairos-mt-standard">
        <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
          <input type="radio" name="route" value="pgm" class="kairos-radio kairos-input kairos-intent-pgm" checked />
          <span class="kairos-text-sm kairos-font-bold kairos-text-color-pgm">PGM</span>
          <span class="kairos-text-xs kairos-text-color-muted kairos-ml-auto">Program output</span>
        </label>
        <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
          <input type="radio" name="route" value="pvw" class="kairos-radio kairos-input kairos-intent-pvw" />
          <span class="kairos-text-sm kairos-font-bold kairos-text-color-pvw">PVW</span>
          <span class="kairos-text-xs kairos-text-color-muted kairos-ml-auto">Preview output</span>
        </label>
        <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
          <input type="radio" name="route" value="aux1" class="kairos-radio kairos-input" />
          <span class="kairos-text-sm kairos-font-bold">AUX-1</span>
          <span class="kairos-text-xs kairos-text-color-muted kairos-ml-auto">Auxiliary bus 1</span>
        </label>
        <label class="kairos-flex kairos-items-center kairos-gap-compact kairos-cursor-pointer">
          <input type="radio" name="route" value="aux2" class="kairos-radio kairos-input" />
          <span class="kairos-text-sm kairos-font-bold">AUX-2</span>
          <span class="kairos-text-xs kairos-text-color-muted kairos-ml-auto">Auxiliary bus 2</span>
        </label>
      </div>
    </fieldset>
  </div>
</div>
